{% extends 'billing/base.html' %}
{% block title %}Submit Bill - UPPCL Billing{% endblock %}
{% block content %}
<div class="card" style="max-width: 620px;">
    <h2>Submit Bill / Record Payment</h2>
    <form method="post">
        {% csrf_token %}
        <label>Customer</label>
        <select name="customer_id" required>
            {% for customer in customers %}
            <option value="{{ customer.pk }}">{{ customer.meter_no }} - {{ customer.name }}</option>
            {% endfor %}
        </select>
        <label>Month</label>
        <select name="month">
            {% for m in months %}<option value="{{ m }}">{{ m }}</option>{% endfor %}
        </select>
        <label>Payment Mode</label>
        <select name="method">
            <option>Cash</option>
            <option>Online</option>
        </select>
        <button class="btn" type="submit">Record Payment</button>
    </form>
</div>
{% endblock %}
